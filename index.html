<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PU Attendance System</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --absent-color: #dc2626;
      --present-color: #16a34a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
    .container { max-width: 600px; width: 100%; background: var(--card-bg); padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    h1 { font-size: 1.5rem; margin-bottom: 20px; text-align: center; color: var(--primary); }
    
    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
    input[type="date"], select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; outline: none; }
    
    .mode-options { display: flex; gap: 10px; margin-top: 6px; }
    .mode-btn { flex: 1; padding: 10px; border: 1px solid var(--border); background: #f1f5f9; border-radius: 6px; text-align: center; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
    .mode-btn.active.absent { background: #fee2e2; color: var(--absent-color); border-color: var(--absent-color); }
    .mode-btn.active.present { background: #dcfce7; color: var(--present-color); border-color: var(--present-color); }

    .student-section { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 16px; }
    .student-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .select-all-btn { background: none; border: none; color: var(--primary); font-weight: 600; cursor: pointer; font-size: 0.85rem; }

    .student-list { max-height: 350px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; }
    .student-item { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
    .student-item:last-child { border-bottom: none; }
    .student-item:hover { background: #f8fafc; }
    .student-item input { width: 18px; height: 18px; margin-right: 12px; cursor: pointer; }
    .student-item span { font-size: 0.95rem; }

    .submit-btn { width: 100%; margin-top: 20px; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .submit-btn:disabled { background: #94a3b8; cursor: not-allowed; }

    .alert { padding: 12px; border-radius: 6px; margin-bottom: 16px; font-size: 0.9rem; display: none; }
    .alert-success { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
    .alert-error { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
    .loading { text-align: center; color: #64748b; padding: 20px; }
  </style>
</head>
<body>

<div class="container">
  <h1>PU Attendance Portal</h1>
  
  <div id="alertBox" class="alert"></div>

  <!-- Step 1: Date Selection -->
  <div class="form-group">
    <label for="attDate">1. Choose Date</label>
    <input type="date" id="attDate">
  </div>

  <!-- Step 2: Class Selection -->
  <div class="form-group">
    <label for="classSelect">2. Choose Class</label>
    <select id="classSelect">
      <option value="">-- Select Class --</option>
      <option value="11">Class 11</option>
      <option value="12">Class 12</option>
    </select>
  </div>

  <!-- Step 3: Attendance Mode -->
  <div class="form-group" id="modeGroup" style="display:none;">
    <label>3. Selection Mode</label>
    <div class="mode-options">
      <div class="mode-btn active absent" id="modeAbsentees" onclick="setMode('absentees')">Mark Absentees</div>
      <div class="mode-btn present" id="modePresentees" onclick="setMode('presentees')">Mark Presentees</div>
    </div>
  </div>

  <!-- Step 4: Student List -->
  <div class="student-section" id="studentSection" style="display:none;">
    <div class="student-header">
      <span id="listTitle" style="font-weight: 600;">Students</span>
      <button class="select-all-btn" id="selectAllBtn" onclick="toggleSelectAll()">Select All</button>
    </div>
    <div class="student-list" id="studentList">
      <div class="loading">Loading student roster...</div>
    </div>
    <button class="submit-btn" id="submitBtn" onclick="submitAttendance()">Submit Attendance</button>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzopeH_4ZMFbCWco9K_K1Ieau5MNEDc7yFdZmGIb8j0Gcolixo8QhrmoiGXNUfHHiAr/exec";

  let allStudents = [];
  let currentMode = 'absentees';

  // Set default date to today
  document.getElementById('attDate').valueAsDate = new Date();

  // Load students automatically on page load
  window.addEventListener('DOMContentLoaded', () => {
    fetchStudents();
  });

  function fetchStudents() {
    fetch(`${SCRIPT_URL}?action=getStudents`)
      .then(res => res.json())
      .then(data => {
        if (data.status === 'success') {
          allStudents = data.students;
          if (document.getElementById('classSelect').value) {
            renderStudentList();
          }
        } else {
          showAlert('Failed to fetch students: ' + data.message, 'error');
        }
      })
      .catch(err => showAlert('Network error fetching students.', 'error'));
  }

  document.getElementById('classSelect').addEventListener('change', function() {
    const selectedClass = this.value;
    if (selectedClass) {
      document.getElementById('modeGroup').style.display = 'block';
      document.getElementById('studentSection').style.display = 'block';
      renderStudentList();
    } else {
      document.getElementById('modeGroup').style.display = 'none';
      document.getElementById('studentSection').style.display = 'none';
    }
  });

  function setMode(mode) {
    currentMode = mode;
    const absBtn = document.getElementById('modeAbsentees');
    const presBtn = document.getElementById('modePresentees');
    
    if (mode === 'absentees') {
      absBtn.classList.add('active', 'absent');
      presBtn.classList.remove('active', 'present');
    } else {
      presBtn.classList.add('active', 'present');
      absBtn.classList.remove('active', 'absent');
    }
  }

  function renderStudentList() {
    const selectedClass = document.getElementById('classSelect').value;
    const listContainer = document.getElementById('studentList');
    listContainer.innerHTML = '';

    if (!allStudents || allStudents.length === 0) {
      listContainer.innerHTML = '<div class="loading">Fetching student list from Google Sheet...</div>';
      return;
    }

    const filtered = allStudents.filter(s => {
      const cls = String(s.class).toLowerCase().trim();
      const target = String(selectedClass).toLowerCase().trim();
      return cls.includes(target) || (target === '11' && cls.includes('xi')) || (target === '12' && cls.includes('xii'));
    });

    if (filtered.length === 0) {
      listContainer.innerHTML = '<div class="loading">No students found for Class ' + selectedClass + '</div>';
      return;
    }

    filtered.forEach((st, idx) => {
      const item = document.createElement('div');
      item.className = 'student-item';
      item.onclick = function(e) {
        if (e.target.tagName !== 'INPUT') {
          const chk = item.querySelector('input');
          chk.checked = !chk.checked;
        }
      };

      item.innerHTML = `
        <input type="checkbox" value="${st.name}" id="st_${idx}">
        <span>${st.name}</span>
      `;
      listContainer.appendChild(item);
    });
  }

  function toggleSelectAll() {
    const checkboxes = document.querySelectorAll('#studentList input[type="checkbox"]');
    const allChecked = Array.from(checkboxes).every(cb => cb.checked);
    checkboxes.forEach(cb => cb.checked = !allChecked);
  }

  function submitAttendance() {
    const dateVal = document.getElementById('attDate').value;
    const selectedClass = document.getElementById('classSelect').value;

    if (!dateVal || !selectedClass) {
      showAlert('Please select date and class.', 'error');
      return;
    }

    const checkedBoxes = document.querySelectorAll('#studentList input[type="checkbox"]:checked');
    const checkedStudents = Array.from(checkedBoxes).map(cb => cb.value);

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = 'Submitting...';

    const payload = {
      action: 'submitAttendance',
      date: dateVal,
      selectedClass: selectedClass,
      mode: currentMode,
      checkedStudents: checkedStudents
    };

    fetch(SCRIPT_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8',
      },
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
      btn.disabled = false;
      btn.innerText = 'Submit Attendance';
      if (data.status === 'success') {
        showAlert('Attendance updated successfully in Google Sheet!', 'success');
        document.querySelectorAll('#studentList input[type="checkbox"]').forEach(cb => cb.checked = false);
      } else {
        showAlert('Error: ' + data.message, 'error');
      }
    })
    .catch(err => {
      btn.disabled = false;
      btn.innerText = 'Submit Attendance';
      showAlert('Failed to connect to Google Sheet backend.', 'error');
    });
  }

  function showAlert(msg, type) {
    const box = document.getElementById('alertBox');
    box.className = `alert alert-${type}`;
    box.innerText = msg;
    box.style.display = 'block';
    if (type === 'success') {
      setTimeout(() => { box.style.display = 'none'; }, 4000);
    }
  }
</script>

</body>
</html>
